<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShiftSync</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Login screen (demo only) -->
<div id="login" class="login"><div class="box">
  <div class="brand">ShiftSync</div>
  <h1>Sign in</h1>
  <p class="note">Demo prototype: sample data only, not connected to a database. This login is NOT secure authentication.</p>
  <form data-form="login" novalidate>
    <label for="em">Email</label><input id="em" name="email" type="email" placeholder="ana@shiftsync.demo">
    <label for="pw">Password</label><input id="pw" name="pw" type="password" placeholder="demo123">
    <p id="lerr" class="err"></p>
    <button class="btn" style="width:100%">Sign in</button>
  </form>
  <p class="muted">Or preview instantly:</p>
  <div class="row" style="justify-content:flex-start;margin-top:0">
    <button class="btn vio" data-act="demo" data-e="ana@shiftsync.demo">Demo Employee</button>
    <button class="btn ghost" data-act="demo" data-e="admin@shiftsync.demo">Demo Admin</button>
  </div>
</div></div>

<!-- App shell -->
<div id="app" hidden>
  <aside id="side"><div class="brand">ShiftSync</div><nav id="nav"></nav>
    <p class="muted small">Prototype: sample data, resets on refresh.</p></aside>
  <div class="main">
    <header class="top">
      <button id="menu" class="btn ghost" data-act="menu" aria-label="Menu">☰</button>
      <span class="badge pending">Demo · sample data</span>
      <div class="user"><span id="who"></span><button class="btn ghost" data-act="logout">Log out</button></div>
    </header>
    <main id="view"></main>
  </div>
</div>

<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
<script src="./data.js"></script>
<script src="./app.js"></script>
</body>
</html>
