services:
  app:
    network_mode: host
    environment:
      DB_ENV_FILE: ${DB_ENV_FILE:-.env.aiven}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-}
      DB_NAME: ${DB_NAME:-}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      APP_ENV: ${APP_ENV:-demo}
      DEMO_MODE: ${DEMO_MODE:-true}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
