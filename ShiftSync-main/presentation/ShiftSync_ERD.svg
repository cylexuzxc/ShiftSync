 x="94" y="373" class="entitySub">Administrator and employee accounts</text><line x1="70" y1="418" x2="630" y2="418" stroke="#e2e8f0" stroke-width="1.5"/><rect x="72" y="418" width="556" height="36" fill="#f8fafc"/><text x="90" y="441" class="field">user_id</text><text x="300" y="441" class="type">INT UNSIGNED</text><rect x="580" y="424" width="36" height="24" rx="7" fill="#dbeafe"/><text x="598.0" y="440" class="tag" text-anchor="middle" fill="#1d4ed8">PK</text><text x="90" y="477" class="field">employee_no</text><text x="300" y="477" class="type">VARCHAR(30)</text><rect x="580" y="460" width="36" height="24" rx="7" fill="#fef3c7"/><text x="598.0" y="476" class="tag" text-anchor="middle" fill="#92400e">UK</text><rect x="72" y="490" width="556" height="36" fill="#f8fafc"/><text x="90" y="513" class="field">first_name</text><text x="300" y="513" class="type">VARCHAR(80)</text><text x="90" y="549" class="field">last_name</text><text x="300" y="549" class="type">VARCHAR(80)</text><rect x="72" y="562" width="556" height="36" fill="#f8fafc"/><text x="90" y="585" class="field">email</text><text x="300" y="585" class="type">VARCHAR(190)</text><rect x="580" y="568" width="36" height="24" rx="7" fill="#fef3c7"/><text x="598.0" y="584" class="tag" text-anchor="middle" fill="#92400e">UK</text><text x="90" y="621" class="field">password_hash</text><text x="300" y="621" class="type">VARCHAR(255)</text><rect x="72" y="634" width="556" height="36" fill="#f8fafc"/><text x="90" y="657" class="field">role</text><text x="300" y="657" class="type">ENUM(admin, employee)</text><text x="90" y="693" class="field">department</text><text x="300" y="693" class="type">VARCHAR(100) NULL</text><rect x="72" y="706" width="556" height="36" fill="#f8fafc"/><text x="90" y="729" class="field">status</text><text x="300" y="729" class="type">ENUM(active, inactive)</text><text x="90" y="765" class="field">created_at</text><text x="300" y="765" class="type">DATETIME</text><rect class="card" x="1280" y="100" width="560" height="364" rx="17" filter="url(#shadow)"/><path d="M1297,100 H1823 Q1840,100 1840,117 V164 H1280 V117 Q1280,100 1297,100 Z" fill="#3157a4"/><text x="1304" y="136" class="entityTitle">SHIFTS</text><text x="1304" y="153" class="entitySub">Reusable shift types</text><line x1="1280" y1="198" x2="1840" y2="198" stroke="#e2e8f0" stroke-width="1.5"/><rect x="1282" y="198" width="556" height="38" fill="#f8fafc"/><text x="1300" y="221" class="field">shift_id</text><text x="1510" y="221" class="type">INT UNSIGNED</text><rect x="1790" y="204" width="36" height="24" rx="7" fill="#dbeafe"/><text x="1808.0" y="220" class="tag" text-anchor="middle" fill="#1d4ed8">PK</text><text x="1300" y="259" class="field">shift_name</text><text x="1510" y="259" class="type">VARCHAR(80)</text><rect x="1790" y="242" width="36" height="24" rx="7" fill="#fef3c7"/><text x="1808.0" y="258" class="tag" text-anchor="middle" fill="#92400e">UK</text><rect x="1282" y="274" width="556" height="38" fill="#f8fafc"/><text x="1300" y="297" class="field">start_time</text><text x="1510" y="297" class="type">TIME</text><text x="1300" y="335" class="field">end_time</text><text x="1510" y="335" class="type">TIME</text><rect x="1282" y="350" width="556" height="38" fill="#f8fafc"/><text x="1300" y="373" class="field">color</text><text x="1510" y="373" class="type">CHAR(7) · #RRGGBB</text><text x="1300" y="411" class="field">created_by</text><text x="1510" y="411" class="type">INT UNSIGNED · NULL</text><rect x="1792" y="394" width="34" height="24" rx="7" fill="#dcfce7"/><text x="1809.0" y="410" class="tag" text-anchor="middle" fill="#166534">FK</text><rect x="1282" y="426" width="556" height="38" fill="#f8fafc"/><text x="1300" y="449" class="field">created_at</text><text x="1510" y="449" class="type">DATETIME</text><rect class="card" x="1280" y="650" width="560" height="364" rx="17" filter="url(#shadow)"/><path d="M1297,650 H1823 Q1840,650 1840,667 V714 H1280 V667 Q1280,650 1297,650 Z" fill="#3157a4"/><text x="1304" y="686" class="entityTitle">SCHEDULES</text><text x="1304" y="703" class="entitySub">Employee assignment for a specific date</text><line x1="1280" y1="748" x2="1840" y2="748" stroke="#e2e8f0" stroke-width="1.5"/><rect x="1282" y="748" width="556" height="38" fill="#f8fafc"/><text x="1300" y="771" class="field">schedule_id</text><text x="1510" y="771" class="type">INT UNSIGNED</text><rect x="1790" y="754" width="36" height="24" rx="7" fill="#dbeafe"/><text x="1808.0" y="770" class="tag" text-anchor="middle" fill="#1d4ed8">PK</text><text x="1300" y="809" class="field">employee_id</text><text x="1510" y="809" class="type">INT UNSIGNED</text><rect x="1792" y="792" width="34" height="24" rx="7" fill="#dcfce7"/><text x="1809.0" y="808" class="tag" text-anchor="middle" fill="#166534">FK</text><rect x="1282" y="824" width="556" height="38" fill="#f8fafc"/><text x="1300" y="847" class="field">shift_id</text><text x="1510" y="847" class="type">INT UNSIGNED</text><rect x="1792" y="830" width="34" height="24" rx="7" fill="#dcfce7"/><text x="1809.0" y="846" class="tag" text-anchor="middle" fill="#166534">FK</text><text x="1300" y="885" class="field">work_date</text><text x="1510" y="885" class="type">DATE</text><rect x="1282" y="900" width="556" height="38" fill="#f8fafc"/><text x="1300" y="923" class="field">assigned_by</text><text x="1510" y="923" class="type">INT UNSIGNED · NULL</text><rect x="1792" y="906" width="34" height="24" rx="7" fill="#dcfce7"/><text x="1809.0" y="922" class="tag" text-anchor="middle" fill="#166534">FK</text><text x="1300" y="961" class="field">notes</text><text x="1510" y="961" class="type">VARCHAR(255) NULL</text><rect x="1282" y="976" width="556" height="38" fill="#f8fafc"/><text x="1300" y="999" class="field">created_at</text><text x="1510" y="999" class="type">DATETIME</text><rect class="card" x="70" y="1020" width="560" height="494" rx="17" filter="url(#shadow)"/><path d="M87,1020 H613 Q630,1020 630,1037 V1084 H70 V1037 Q70,1020 87,1020 Z" fill="#3157a4"/><text x="94" y="1056" class="entityTitle">LEAVE_REQUESTS</text><text x="94" y="1073" class="entitySub">Employee leave and administrator decision</text><line x1="70" y1="1118" x2="630" y2="1118" stroke="#e2e8f0" stroke-width="1.5"/><rect x="72" y="1118" width="556" height="36" fill="#f8fafc"/><text x="90" y="1141" class="field">leave_request_id</text><text x="300" y="1141" class="type">INT UNSIGNED</text><rect x="580" y="1124" width="36" height="24" rx="7" fill="#dbeafe"/><text x="598.0" y="1140" class="tag" text-anchor="middle" fill="#1d4ed8">PK</text><text x="90" y="1177" class="field">employee_id</text><text x="300" y="1177" class="type">INT UNSIGNED</text><rect x="582" y="1160" width="34" height="24" rx="7" fill="#dcfce7"/><text x="599.0" y="1176" class="tag" text-anchor="middle" fill="#166534">FK</text><rect x="72" y="1190" width="556" height="36" fill="#f8fafc"/><text x="90" y="1213" class="field">leave_type</text><text x="300" y="1213" class="type">ENUM(Vacation, Sick, Personal, Emergency)</text><text x="90" y="1249" class="field">start_date</text><text x="300" y="1249" class="type">DATE</text><rect x="72" y="1262" width="556" height="36" fill="#f8fafc"/><text x="90" y="1285" class="field">end_date</text><text x="300" y="1285" class="type">DATE</text><text x="90" y="1321" class="field">reason</text><text x="300" y="1321" class="type">VARCHAR(500)</text><rect x="72" y="1334" width="556" height="36" fill="#f8fafc"/><text x="90" y="1357" class="field">status</text><text x="300" y="1357" class="type">ENUM(pending, approved, rejected)</text><text x="90" y="1393" class="field">reviewed_by</text><text x="300" y="1393" class="type">INT UNSIGNED · NULL</text><rect x="582" y="1376" width="34" height="24" rx="7" fill="#dcfce7"/><text x="599.0" y="1392" class="tag" text-anchor="middle" fill="#166534">FK</text><rect x="72" y="1406" width="556" height="36" fill="#f8fafc"/><text x="90" y="1429" class="field">reviewed_at</text><text x="300" y="1429" class="type">DATETIME · NULL</text><text x="90" y="1465" class="field">admin_remarks</text><text x="300" y="1465" class="type">VARCHAR(500) NULL</text><rect x="72" y="1478" width="556" height="36" fill="#f8fafc"/><text x="90" y="1501" class="field">created_at</text><text x="300" y="1501" class="type">DATETIME</text><rect x="720" y="1115" width="1120" height="330" rx="18" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
<text x="755" y="1160" class="entityTitle" style="fill:#1e3a8a">Relationship and constraint notes</text>
<text x="755" y="1204" class="legend">• One employee can have many schedules and many leave requests.</text>
<text x="755" y="1242" class="legend">• Each schedule refers to one employee and one shift type.</text>
<text x="755" y="1280" class="legend">• Admin-created / reviewed references are optional while unset.</text>
<text x="755" y="1318" class="legend">• UNIQUE (employee_id, work_date) allows at most one shift per employee per day.</text>
<text x="755" y="1356" class="legend">• Backend authorization must ensure only admins assign shifts and review requests.</text>
<line x1="755" y1="1383" x2="1800" y2="1383" stroke="#c7d2fe" stroke-width="1.5"/>
<text x="755" y="1417" class="legend"><tspan font-weight="700">PK</tspan> Primary key     <tspan font-weight="700">FK</tspan> Foreign key     <tspan font-weight="700">UK</tspan> Unique key     NULL = optional value</text>
<text x="70" y="1550" class="subtitle">Design reference for presentation · Check schema.sql before implementation · Demo frontend currently uses sample data</text>
</svg>